[project]
name = "mimir-engine"
version = "0.1.0"
description = "Local-first AI agent memory: an Obsidian-compatible markdown brain with hybrid recall, for Claude Code and any MCP client"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Anish Naik" }]
keywords = ["ai", "memory", "mcp", "agents", "obsidian", "local-first", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pyyaml>=6.0.2",
    "redis>=5.0.8",
    "duckdb>=1.1.0",
    "httpx>=0.27.2",
    "qdrant-client>=1.11.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "fakeredis>=2.25.0",
]
# Not a core dependency on purpose — "every dependency is an upgrade, never a
# requirement" applies here too. embed_hybrid() degrades to EmbeddingsUnavailable
# if this isn't installed, same as any other missing/unconfigured provider.
fastembed = [
    "fastembed>=0.3.0",
]
# Not a core dependency on purpose, same reasoning as fastembed above.
# extract_entities_naive() degrades to the regex heuristic if this isn't
# installed. en_core_web_sm is pulled directly from its release wheel since
# spaCy models aren't distributed as regular PyPI packages.
ner = [
    "spacy>=3.8",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
# Needed for the `ner` extra: spaCy models aren't on PyPI, only as
# direct-download wheel URLs.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
